<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoCapi Birthday Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #birthday-alert {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(200px);
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 18px;
            background: linear-gradient(135deg, rgba(14, 10, 26, 0.92), rgba(30, 16, 60, 0.92));
            border: 2px solid rgba(145, 70, 255, 0.6);
            border-radius: 20px;
            padding: 18px 28px;
            box-shadow:
                0 0 0 1px rgba(145, 70, 255, 0.2),
                0 8px 40px rgba(145, 70, 255, 0.4),
                0 0 80px rgba(145, 70, 255, 0.15);
            backdrop-filter: blur(16px);
            min-width: 380px;
            max-width: 560px;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 100;
        }

        #birthday-alert.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .alert-avatar-wrap { position: relative; flex-shrink: 0; }

        .alert-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(145, 70, 255, 0.7);
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.5);
        }

        .alert-avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #9146ff, #bf94ff, #f7d046, #ff6bcb, #9146ff);
            z-index: -1;
            animation: ring-spin 3s linear infinite;
        }

        @keyframes ring-spin { to { transform: rotate(360deg); } }

        .alert-content { flex: 1; }

        .alert-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #bf94ff;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .alert-user {
            font-size: 1.75rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        /* Indicador de cola: "+2 más en cola" */
        .alert-queue-badge {
            font-size: 0.7rem;
            font-weight: 700;
            color: #bf94ff;
            opacity: 0.7;
            margin-top: 2px;
        }

        .alert-emoji {
            font-size: 2.2rem;
            flex-shrink: 0;
            animation: emoji-bounce 0.6s ease-in-out infinite alternate;
        }

        @keyframes emoji-bounce {
            from { transform: translateY(0) rotate(-5deg) scale(1); }
            to   { transform: translateY(-6px) rotate(5deg) scale(1.08); }
        }

        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 50;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            border-radius: 2px;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Indicadores de debug — visibles solo con ?dev=1 */
        #status, #queue-status {
            position: fixed;
            right: 10px;
            font-family: monospace;
            display: none;
        }
        #status       { top: 10px; font-size: 0.65rem; color: rgba(255,255,255,0.3); }
        #queue-status { top: 26px; font-size: 0.60rem; color: rgba(191,148,255,0.5); }
        body.dev-mode #status,
        body.dev-mode #queue-status { display: block; }
    </style>
</head>
<body>
    <div id="confetti-container" class="confetti-container"></div>

    <div id="birthday-alert">
        <div class="alert-avatar-wrap">
            <div class="alert-avatar-ring"></div>
            <img id="alert-avatar" src="" alt="" class="alert-avatar">
        </div>
        <div class="alert-content">
            <div class="alert-title">🎂 ¡Hoy es su cumpleaños!</div>
            <div id="alert-user" class="alert-user">Usuario</div>
            <div id="alert-queue-badge" class="alert-queue-badge" style="display:none;"></div>
        </div>
        <div class="alert-emoji">🎉</div>
    </div>

    <div id="status">Conectando...</div>
    <div id="queue-status">Cola: 0</div>

    <script>
        const BACKEND = 'http://localhost:3001';

        const alertEl    = document.getElementById('birthday-alert');
        const avatarEl   = document.getElementById('alert-avatar');
        const userEl     = document.getElementById('alert-user');
        const queueBadge = document.getElementById('alert-queue-badge');
        const statusEl   = document.getElementById('status');
        const queueDbg   = document.getElementById('queue-status');
        const confettiC  = document.getElementById('confetti-container');

        let overlayToken = null;

        // ── Cola FIFO de alertas ──────────────────────────────────────────────
        const alertQueue = [];  // { user, avatar, sound, soundName }
        let   isPlaying  = false;
        const MAX_QUEUE  = 5;       // descarta el más viejo si se supera
        const DISPLAY_MS = 10_000; // tiempo máximo por alerta (ms)

        function dbgQueue() {
            queueDbg.textContent = `Cola: ${alertQueue.length} | playing: ${isPlaying}`;
        }

        function enqueueAlert(data) {
            if (alertQueue.length >= MAX_QUEUE) {
                alertQueue.shift(); // descartar el más antiguo
                console.warn('[OVERLAY] Cola llena — se descartó una alerta antigua.');
            }
            alertQueue.push(data);
            dbgQueue();
            if (!isPlaying) processQueue();
        }

        function processQueue() {
            if (alertQueue.length === 0) {
                isPlaying = false;
                dbgQueue();
                return;
            }

            isPlaying = true;
            const data = alertQueue.shift();
            dbgQueue();

            // Mostrar cuántas quedan pendientes
            if (alertQueue.length > 0) {
                queueBadge.textContent = `+${alertQueue.length} más en cola`;
                queueBadge.style.display = 'block';
            } else {
                queueBadge.style.display = 'none';
            }

            const show = () => {
                avatarEl.src      = data.avatar || '';
                userEl.textContent = data.user || 'Cumpleañero';

                // Reiniciar transición CSS
                alertEl.classList.remove('show');
                void alertEl.offsetWidth;
                alertEl.classList.add('show');

                launchConfetti();

                // advance() se llama una sola vez (audio.ended O timeout)
                let done = false;
                const advance = () => {
                    if (done) return;
                    done = true;
                    alertEl.classList.remove('show');
                    setTimeout(processQueue, 800); // pausa entre alertas
                };

                if (data.sound) {
                    const tok = overlayToken ? `?token=${overlayToken}` : '';
                    const audio = new Audio(`${BACKEND}/music/${data.sound}${tok}`);
                    audio.volume = 1;
                    audio.play().catch(() => {});
                    audio.addEventListener('ended', advance);
                    setTimeout(advance, DISPLAY_MS); // seguridad si el audio es muy largo
                } else {
                    setTimeout(advance, DISPLAY_MS);
                }
            };

            // Pre-cargar avatar para evitar parpadeo
            if (data.avatar) {
                const img = new Image();
                img.onload = img.onerror = show;
                img.src = data.avatar;
            } else {
                show();
            }
        }

        // ── Confetti ──────────────────────────────────────────────────────────
        const COLORS = ['#9146ff','#bf94ff','#f7d046','#ff6bcb','#4fc3f7','#ff8a65','#66bb6a'];

        function launchConfetti() {
            confettiC.innerHTML = '';
            for (let i = 0; i < 80; i++) {
                const p   = document.createElement('div');
                p.className = 'confetti-piece';
                const col = COLORS[Math.floor(Math.random() * COLORS.length)];
                const sz  = (7 + Math.random() * 8).toFixed(1);
                p.style.cssText = `
                    background: ${col};
                    left: ${(Math.random() * 100).toFixed(1)}%;
                    width: ${sz}px; height: ${sz}px;
                    animation-duration: ${(2.5 + Math.random() * 2.5).toFixed(2)}s;
                    animation-delay: ${(Math.random() * 1.5).toFixed(2)}s;
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                `;
                confettiC.appendChild(p);
            }
            setTimeout(() => confettiC.innerHTML = '', 6000);
        }

        // ── SSE ───────────────────────────────────────────────────────────────
        function connectSSE() {
            statusEl.textContent = 'Conectando SSE...';
            const tok = overlayToken ? `?token=${overlayToken}` : '';
            const src = new EventSource(`${BACKEND}/api/overlay/stream${tok}`);

            src.addEventListener('state', e => {
                const d = JSON.parse(e.data);
                const names = d.activeBirthdays || [];
                statusEl.textContent = names.length > 0
                    ? `🎂 Hoy: ${names.join(', ')}`
                    : 'Sin cumpleaños hoy';
            });

            src.addEventListener('birthday', e => {
                enqueueAlert(JSON.parse(e.data));
            });

            src.onerror = () => {
                statusEl.textContent = 'Reconectando...';
                src.close();
                setTimeout(connectSSE, 5000);
            };

            src.onopen = () => { statusEl.textContent = 'SSE conectado ✓'; };
        }

        if (new URLSearchParams(location.search).get('dev') === '1') {
            document.body.classList.add('dev-mode');
        }

        fetch(`${BACKEND}/api/overlay/token`)
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d?.token) overlayToken = d.token; })
            .catch(() => {})
            .finally(connectSSE);
    </script>
</body>
</html>
