<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YoCapi Birthday Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #birthday-alert {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(200px);
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 16px;
            background: linear-gradient(135deg, rgba(14, 10, 26, 0.93), rgba(30, 16, 60, 0.93));
            border: 2px solid var(--theme-color, rgba(145, 70, 255, 0.6));
            border-radius: 20px;
            padding: 16px 22px;
            box-shadow:
                0 0 0 1px color-mix(in srgb, var(--theme-solid, #9146ff) 20%, transparent),
                0 8px 40px color-mix(in srgb, var(--theme-solid, #9146ff) 40%, transparent),
                0 0 80px color-mix(in srgb, var(--theme-solid, #9146ff) 15%, transparent);
            backdrop-filter: blur(16px);
            min-width: 360px;
            max-width: 580px;
            width: max-content;
            pointer-events: none;
            z-index: 100;
        }

        /* Entry animations */
        #birthday-alert.anim-default { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        #birthday-alert.anim-bounce  { transition: all 0.5s cubic-bezier(0.68, -0.6, 0.32, 1.6); }
        #birthday-alert.anim-zoom    { transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); transform: translateX(-50%) scale(0.2); opacity:0; }
        #birthday-alert.anim-spin    { transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); transform: translateX(-50%) translateY(200px) rotate(360deg); opacity:0; }

        #birthday-alert.show.anim-default { transform: translateX(-50%) translateY(0); opacity: 1; }
        #birthday-alert.show.anim-bounce  { transform: translateX(-50%) translateY(0); opacity: 1; }
        #birthday-alert.show.anim-zoom    { transform: translateX(-50%) scale(1);      opacity: 1; }
        #birthday-alert.show.anim-spin    { transform: translateX(-50%) translateY(0) rotate(0deg); opacity: 1; }

        .alert-avatar-wrap { position: relative; flex-shrink: 0; }

        .alert-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid color-mix(in srgb, var(--theme-solid, #9146ff) 70%, transparent);
            box-shadow: 0 0 20px color-mix(in srgb, var(--theme-solid, #9146ff) 50%, transparent);
        }

        .alert-avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: var(--theme-ring, conic-gradient(from 0deg, #9146ff, #bf94ff, #f7d046, #ff6bcb, #9146ff));
            z-index: -1;
            animation: ring-spin 3s linear infinite;
        }

        @keyframes ring-spin { to { transform: rotate(360deg); } }

        .alert-content {
            flex: 1;
            min-width: 0;   /* prevents flex overflow */
            overflow: hidden;
        }

        .alert-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: color-mix(in srgb, var(--theme-solid, #9146ff) 80%, #fff 60%);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 4px;
            white-space: nowrap;
        }

        .alert-user {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 360px;
        }

        /* Queue badge */
        .alert-queue-badge {
            font-size: 0.68rem;
            font-weight: 700;
            color: #bf94ff;
            opacity: 0.7;
            margin-top: 2px;
        }

        .alert-emoji {
            font-size: 2.2rem;
            flex-shrink: 0;
            animation: emoji-bounce 0.6s ease-in-out infinite alternate;
        }

        @keyframes emoji-bounce {
            from { transform: translateY(0) rotate(-5deg) scale(1); }
            to   { transform: translateY(-6px) rotate(5deg) scale(1.08); }
        }

        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 50;
        }

        .confetti-piece {
            position: absolute;
            top: -20px;
            border-radius: 2px;
            animation: confetti-fall linear forwards;
        }

        @keyframes confetti-fall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Indicadores de debug — visibles solo con ?dev=1 */
        #status, #queue-status {
            position: fixed;
            right: 10px;
            font-family: monospace;
            display: none;
        }
        #status       { top: 10px; font-size: 0.65rem; color: rgba(255,255,255,0.3); }
        #queue-status { top: 26px; font-size: 0.60rem; color: rgba(191,148,255,0.5); }
        body.dev-mode #status,
        body.dev-mode #queue-status { display: block; }

        .alert-message {
            font-size: 1rem;
            color: #ddd;
            margin-top: 6px;
            font-style: italic;
            border-left: 3px solid var(--theme-solid, #ff6bcb);
            padding-left: 8px;
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: normal;
            max-width: 360px;
        }

        /* Age badge */
        .alert-age-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 5px;
            background: color-mix(in srgb, var(--theme-solid, #9146ff) 20%, transparent);
            border: 1px solid color-mix(in srgb, var(--theme-solid, #9146ff) 50%, transparent);
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            animation: age-pop 0.5s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes age-pop {
            from { transform: scale(0) rotate(-10deg); opacity: 0; }
            to   { transform: scale(1) rotate(0deg);   opacity: 1; }
        }
        .alert-age-num {
            font-size: 1.1rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--theme-solid, #9146ff), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: age-bounce 0.8s 0.5s ease-in-out infinite alternate;
        }
        @keyframes age-bounce {
            from { transform: translateY(0); }
            to   { transform: translateY(-3px); }
        }

        /* Capybara mascot */
        .alert-capi {
            font-size: 2.4rem;
            flex-shrink: 0;
            animation: capi-dance 1s ease-in-out infinite alternate;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
        }
        @keyframes capi-dance {
            from { transform: rotate(-6deg) scale(1);    }
            to   { transform: rotate(6deg)  scale(1.08); }
        }
    </style>
</head>
<body>
    <div id="confetti-container" class="confetti-container"></div>

    <div id="birthday-alert" class="anim-default">
        <div class="alert-avatar-wrap">
            <div class="alert-avatar-ring"></div>
            <img id="alert-avatar" src="" alt="" class="alert-avatar">
        </div>
        <div class="alert-content">
            <div class="alert-title">🎂 ¡Hoy es su cumpleaños!</div>
            <div id="alert-user" class="alert-user">Usuario</div>
            <div id="alert-age" class="alert-age-badge" style="display:none;">
                🎂 <span class="alert-age-num" id="alert-age-num">0</span> años
            </div>
            <div id="alert-message" class="alert-message" style="display:none;"></div>
            <div id="alert-queue-badge" class="alert-queue-badge" style="display:none;"></div>
        </div>
        <div class="alert-emoji">🎉</div>
        <div id="alert-capi" class="alert-capi" style="display:none;"></div>
    </div>

    <div id="status">Conectando...</div>
    <div id="queue-status">Cola: 0</div>

    <script>
        const BACKEND = 'http://localhost:3001';

        const alertEl    = document.getElementById('birthday-alert');
        const avatarEl   = document.getElementById('alert-avatar');
        const userEl     = document.getElementById('alert-user');
        const msgEl      = document.getElementById('alert-message');
        const ageEl      = document.getElementById('alert-age');
        const ageNumEl   = document.getElementById('alert-age-num');
        const capiEl     = document.getElementById('alert-capi');
        const emojiEl    = document.querySelector('.alert-emoji');
        const queueBadge = document.getElementById('alert-queue-badge');
        const statusEl   = document.getElementById('status');
        const queueDbg   = document.getElementById('queue-status');
        const confettiC  = document.getElementById('confetti-container');

        // ── Temas de color ────────────────────────────────────────────────────
        const THEMES = {
            purple:    { color: 'rgba(145,70,255,0.6)',  solid: '#9146ff', ring: 'conic-gradient(from 0deg,#9146ff,#bf94ff,#f7d046,#ff6bcb,#9146ff)' },
            pink:      { color: 'rgba(255,107,203,0.6)', solid: '#ff6bcb', ring: 'conic-gradient(from 0deg,#ff6bcb,#ffb3e6,#f7d046,#9146ff,#ff6bcb)' },
            gold:      { color: 'rgba(247,208,70,0.6)',  solid: '#f7d046', ring: 'conic-gradient(from 0deg,#f7d046,#fff4a0,#ff8a65,#f7d046,#f7d046)' },
            blue:      { color: 'rgba(79,195,247,0.6)',  solid: '#4fc3f7', ring: 'conic-gradient(from 0deg,#4fc3f7,#b3e5fc,#9146ff,#ff6bcb,#4fc3f7)' },
            green:     { color: 'rgba(61,220,132,0.6)',  solid: '#3ddc84', ring: 'conic-gradient(from 0deg,#3ddc84,#b9f5d8,#f7d046,#4fc3f7,#3ddc84)' },
            red:       { color: 'rgba(255,92,92,0.6)',   solid: '#ff5c5c', ring: 'conic-gradient(from 0deg,#ff5c5c,#ffb3b3,#f7d046,#ff6bcb,#ff5c5c)' },
            capybara:  { color: 'rgba(201,149,106,0.7)', solid: '#c9956a', ring: 'conic-gradient(from 0deg,#c9956a,#e8c9a0,#f7d046,#a0624a,#c9956a)' },
            capinight: { color: 'rgba(123,94,167,0.7)',  solid: '#7b5ea7', ring: 'conic-gradient(from 0deg,#7b5ea7,#b39ddb,#c9956a,#3d2b6b,#7b5ea7)' },
        };

        // ── Capybara mascots ──────────────────────────────────────────────────
        const CAPI_ICONS = { none:'', cute:'🦫', party:'🎊🦫', royal:'👑🦫', kawaii:'🌸🦫' };

        function applyTheme(name) {
            const t = THEMES[name] || THEMES.purple;
            alertEl.style.setProperty('--theme-color', t.color);
            alertEl.style.setProperty('--theme-solid', t.solid);
            alertEl.style.setProperty('--theme-ring',  t.ring);
        }

        let overlayToken = null;

        // ── Cola FIFO de alertas ──────────────────────────────────────────────
        const alertQueue = [];  // { user, avatar, sound, soundName }
        let   isPlaying  = false;
        const MAX_QUEUE  = 5;       // descarta el más viejo si se supera
        const DISPLAY_MS = 10_000; // tiempo máximo por alerta (ms)

        function dbgQueue() {
            queueDbg.textContent = `Cola: ${alertQueue.length} | playing: ${isPlaying}`;
        }

        function enqueueAlert(data) {
            if (alertQueue.length >= MAX_QUEUE) {
                alertQueue.shift(); // descartar el más antiguo
                console.warn('[OVERLAY] Cola llena — se descartó una alerta antigua.');
            }
            alertQueue.push(data);
            dbgQueue();
            if (!isPlaying) processQueue();
        }

        function processQueue() {
            if (alertQueue.length === 0) {
                isPlaying = false;
                dbgQueue();
                return;
            }

            isPlaying = true;
            const data = alertQueue.shift();
            dbgQueue();

            // Mostrar cuántas quedan pendientes
            if (alertQueue.length > 0) {
                queueBadge.textContent = `+${alertQueue.length} más en cola`;
                queueBadge.style.display = 'block';
            } else {
                queueBadge.style.display = 'none';
            }

            const show = () => {
                avatarEl.src       = data.avatar || '';
                userEl.textContent = data.user || 'Cumpleañero';

                // Apply animation class
                alertEl.className = 'anim-' + (data.anim || 'default');

                // Apply theme
                applyTheme(data.theme || 'purple');

                // Apply emoji
                emojiEl.textContent = data.emoji || '🎉';

                // Apply age badge
                if (data.age && data.age > 0) {
                    ageNumEl.textContent = data.age;
                    ageEl.style.display = 'inline-flex';
                } else {
                    ageEl.style.display = 'none';
                }

                // Apply capybara mascot
                const capiIcon = CAPI_ICONS[data.capi] || '';
                if (capiIcon) {
                    capiEl.textContent  = capiIcon;
                    capiEl.style.display = 'block';
                } else {
                    capiEl.style.display = 'none';
                }

                if (data.message) {
                    msgEl.textContent   = `"${data.message}"`;
                    msgEl.style.display = 'block';
                } else {
                    msgEl.style.display = 'none';
                    msgEl.textContent   = '';
                }

                // Reiniciar transición CSS
                alertEl.classList.remove('show');
                void alertEl.offsetWidth;
                alertEl.classList.add('show');

                launchConfetti();

                // advance() se llama una sola vez (audio.ended O timeout)
                let done = false;
                const advance = () => {
                    if (done) return;
                    done = true;
                    alertEl.classList.remove('show');
                    setTimeout(processQueue, 5000); // 5 segundos de pausa entre alertas
                };

                if (data.sound) {
                    const tok = overlayToken ? `?token=${overlayToken}` : '';
                    const audio = new Audio(`${BACKEND}/music/${data.sound}${tok}`);
                    audio.volume = 1;
                    audio.play().catch(() => {});
                    audio.addEventListener('ended', advance);
                    setTimeout(advance, DISPLAY_MS); // seguridad si el audio es muy largo
                } else {
                    setTimeout(advance, DISPLAY_MS);
                }
            };

            // Pre-cargar avatar para evitar parpadeo
            if (data.avatar) {
                const img = new Image();
                img.onload = img.onerror = show;
                img.src = data.avatar;
            } else {
                show();
            }
        }

        // ── Confetti ──────────────────────────────────────────────────────────
        const COLORS = ['#9146ff','#bf94ff','#f7d046','#ff6bcb','#4fc3f7','#ff8a65','#66bb6a'];

        function launchConfetti() {
            confettiC.innerHTML = '';
            for (let i = 0; i < 80; i++) {
                const p   = document.createElement('div');
                p.className = 'confetti-piece';
                const col = COLORS[Math.floor(Math.random() * COLORS.length)];
                const sz  = (7 + Math.random() * 8).toFixed(1);
                p.style.cssText = `
                    background: ${col};
                    left: ${(Math.random() * 100).toFixed(1)}%;
                    width: ${sz}px; height: ${sz}px;
                    animation-duration: ${(2.5 + Math.random() * 2.5).toFixed(2)}s;
                    animation-delay: ${(Math.random() * 1.5).toFixed(2)}s;
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                `;
                confettiC.appendChild(p);
            }
            setTimeout(() => confettiC.innerHTML = '', 6000);
        }

        // ── SSE ───────────────────────────────────────────────────────────────
        function connectSSE() {
            statusEl.textContent = 'Conectando SSE...';
            const tok = overlayToken ? `?token=${overlayToken}` : '';
            const src = new EventSource(`${BACKEND}/api/overlay/stream${tok}`);

            src.addEventListener('state', e => {
                const d = JSON.parse(e.data);
                const names = d.activeBirthdays || [];
                statusEl.textContent = names.length > 0
                    ? `🎂 Hoy: ${names.join(', ')}`
                    : 'Sin cumpleaños hoy';
            });

            src.addEventListener('birthday', e => {
                enqueueAlert(JSON.parse(e.data));
            });

            src.onerror = () => {
                statusEl.textContent = 'Reconectando...';
                src.close();
                setTimeout(connectSSE, 5000);
            };

            src.onopen = () => { statusEl.textContent = 'SSE conectado ✓'; };
        }

        if (new URLSearchParams(location.search).get('dev') === '1') {
            document.body.classList.add('dev-mode');
        }

        fetch(`${BACKEND}/api/overlay/token`)
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d?.token) overlayToken = d.token; })
            .catch(() => {})
            .finally(connectSSE);
    </script>
</body>
</html>
